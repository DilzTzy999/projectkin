name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Unique build ID"
        required: true
        type: string

      zip_path:
        description: "Path of project ZIP"
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Show ZIP
        run: |
          echo "Build ID: ${{ inputs.build_id }}"
          echo "ZIP: ${{ inputs.zip_path }}"

          ls -lh "${{ inputs.zip_path }}"

      - name: Extract project
        run: |
          rm -rf project
          mkdir -p project

          unzip -q "${{ inputs.zip_path }}" -d project

          echo "=== Extracted structure ==="
          find project -maxdepth 3 -type f | head -100

      - name: Detect Flutter project
        id: detect_project
        run: |
          echo "Mencari pubspec.yaml..."

          PUBSPEC=$(find project -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan."

            echo ""
            echo "Isi project:"
            find project -maxdepth 4 -type f | head -200

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project ditemukan:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Isi project:"
          ls -lah "$PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter dependencies
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        run: |
          flutter pub get

      - name: Build APK
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        run: |
          flutter build apk --release

      - name: Find APK
        run: |
          echo "=== APK files ==="

          find "${{ steps.detect_project.outputs.project_dir }}" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_id }}
          path: ${{ steps.detect_project.outputs.project_dir }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
