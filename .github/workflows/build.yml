name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        required: true
        type: string

      tag:
        required: true
        type: string

      build_type:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download ZIP
        run: |
          wget -O project.zip "${{ github.event.inputs.zip_url }}"

      - name: Extract ZIP
        run: |
          unzip project.zip -d project

      - name: Find Flutter Project
        run: |
          PROJECT=$(find project -name pubspec.yaml | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "Flutter project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> $GITHUB_ENV

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'debug'
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --debug

      - name: Build Release APK
        if: github.event.inputs.build_type != 'debug'
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-apk
          path: |
            ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/*.apk
