name: Build APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL file ZIP"
        required: true
        type: string

      tag:
        description: "Build tag"
        required: true
        type: string

      build_type:
        description: "Build type (debug/release)"
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Download ZIP
        run: |
          echo "Tag: ${{ inputs.tag }}"
          echo "Build type: ${{ inputs.build_type }}"
          echo "ZIP URL: ${{ inputs.zip_url }}"

          wget -O project.zip "${{ inputs.zip_url }}"

          ls -lh project.zip

      - name: Extract project
        run: |
          rm -rf project
          mkdir -p project

          unzip -q project.zip -d project

          echo "=== Extracted structure ==="
          find project -maxdepth 3 -type f | head -100

      - name: Detect Flutter project
        id: detect_project
        run: |
          echo "Searching for pubspec.yaml..."

          PUBSPEC=$(find project -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."

            echo ""
            echo "Project contents:"

            find project -maxdepth 4 -type f | head -200

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project found:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Project contents:"

          ls -lah "$PROJECT_DIR"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Flutter dependencies
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        run: |
          flutter pub get

      - name: Build APK
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Find APK
        run: |
          echo "=== APK files ==="

          find "${{ steps.detect_project.outputs.project_dir }}" \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.tag }}
          path: ${{ steps.detect_project.outputs.project_dir }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
