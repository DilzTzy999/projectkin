name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Unique build ID"
        required: true
        type: string

      telegram_file_id:
        description: "Telegram file ID"
        required: true
        type: string

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip jq curl

      - name: Debug information
        run: |
          echo "Build ID: ${{ github.event.inputs.build_id }}"
          echo "Telegram file ID:"
          echo "${{ github.event.inputs.telegram_file_id }}"
          echo "Token length: ${#BOT_TOKEN}"

      - name: Get Telegram file path
        run: |
          FILE_ID="${{ github.event.inputs.telegram_file_id }}"

          RESPONSE=$(curl -s \
            "https://api.telegram.org/bot${BOT_TOKEN}/getFile?file_id=${FILE_ID}")

          echo "Telegram response:"
          echo "$RESPONSE"

          FILE_PATH=$(echo "$RESPONSE" | jq -r '.result.file_path')

          if [ -z "$FILE_PATH" ] || [ "$FILE_PATH" = "null" ]; then
            echo "ERROR: file_path tidak ditemukan."
            exit 1
          fi

          echo "FILE_PATH=$FILE_PATH" >> "$GITHUB_ENV"

      - name: Download ZIP from Telegram
        run: |
          curl -L \
            "https://api.telegram.org/file/bot${BOT_TOKEN}/${FILE_PATH}" \
            -o project.zip

          echo "ZIP downloaded:"
          ls -lh project.zip

      - name: Extract project
        run: |
          rm -rf project
          mkdir -p project

          unzip -q project.zip -d project

          echo "=== Extracted structure ==="
          find project -maxdepth 3 -type f | head -100

      - name: Detect Flutter project
        id: detect_project
        run: |
          PUBSPEC=$(find project -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan."

            echo "Isi folder:"
            find project -maxdepth 5 -type f | head -200

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project ditemukan:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.detect_project.outputs.project_dir }}
        run: flutter build apk --release

      - name: Find APK
        run: |
          find "${{ steps.detect_project.outputs.project_dir }}" \
            -type f \
            -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.build_id }}
          path: ${{ steps.detect_project.outputs.project_dir }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
